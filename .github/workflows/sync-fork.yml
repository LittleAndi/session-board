name: Sync fork

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Only meaningful in a fork; skip in the upstream repo.
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch="${{ github.event.repository.default_branch }}"
